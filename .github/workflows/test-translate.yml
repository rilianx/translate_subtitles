name: test-translate

on:
  workflow_dispatch:
    inputs:
      modelos:
        description: 'Lista JSON de modelos a probar'
        default: '["claude-opus-5-5"]'

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(inputs.modelos) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "anthropic>=2.3"
      - name: Traducir muestra
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: |
          set -o pipefail
          start=$(date +%s)
          python translate.py tests/sample.srt --model ${{ matrix.model }} \
            --notas "Cumbres Borrascosas (Wuthering Heights), Inglaterra rural, siglo XVIII" 2>&1 | tee tests/log.txt
          echo "Duración: $(( $(date +%s) - start ))s" | tee -a tests/log.txt
      - name: Verificar tiempos y numeración
        run: |
          python - <<'PY'
          import translate as T
          a, b = T.leer_srt("tests/sample.srt"), T.leer_srt("tests/sample.spa.srt")
          assert len(a) == len(b), (len(a), len(b))
          assert all(x["tiempo"] == y["tiempo"] for x, y in zip(a, b)), "tiempos distintos"
          iguales = sum(x["texto"] == y["texto"] for x, y in zip(a, b))
          print(f"{len(b)} subtítulos, tiempos idénticos, {iguales} sin cambio de texto")
          assert iguales <= len(a) * 0.15, "demasiados subtítulos sin traducir"
          PY
      - name: Publicar resultado en la rama resultado-<modelo>
        if: always()
        run: |
          mkdir -p /tmp/out && cp tests/sample.spa.srt tests/sample.ficha.md tests/log.txt /tmp/out/ 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan out
          git rm -rq --cached .
          cp /tmp/out/* . 2>/dev/null || true
          echo "${{ github.run_id }} ${{ job.status }}" > run.txt
          git add run.txt log.txt sample.spa.srt sample.ficha.md 2>/dev/null || git add run.txt
          git commit -qm "test-translate ${{ matrix.model }} ${{ github.run_id }}"
          git push -f origin HEAD:refs/heads/resultado-${{ matrix.model }}
